name: Sync upstream

on:
  schedule:
    - cron: "0 5 * * *" # daily 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Follow the fork's own default branch (some forks use master, not main).
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Merge upstream
        id: merge
        env:
          UPSTREAM: https://github.com/pythonscad/pythonscad.git
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM"
          git fetch --no-tags upstream "$BRANCH"
          # Already up to date: upstream tip is an ancestor of HEAD.
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "status=noop" >> "$GITHUB_OUTPUT"
            echo "already up to date"
            exit 0
          fi
          # Fast-forwards when possible, otherwise a real merge commit.
          if git merge --no-edit FETCH_HEAD; then
            echo "status=merged" >> "$GITHUB_OUTPUT"
          else
            git merge --abort
            echo "status=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: Push clean merge
        if: steps.merge.outputs.status == 'merged'
        run: git push origin HEAD:${{ github.event.repository.default_branch }}

      - name: Open PR on conflict
        if: steps.merge.outputs.status == 'conflict'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git switch -c upstream-sync
          git merge --no-edit upstream/${{ github.event.repository.default_branch }} || true
          git add -A
          git commit -m "chore: merge upstream (conflicts need resolution)"
          git push -f origin upstream-sync
          gh pr create --base "${{ github.event.repository.default_branch }}" --head upstream-sync \
            --title "Sync with upstream (conflicts)" \
            --body "Automatic merge of upstream hit conflicts. Resolve locally:
          \`\`\`
          git fetch origin upstream-sync
          git switch upstream-sync
          # fix the conflict markers, then
          git commit -am resolve && git push
          \`\`\`" || echo "PR already open"
